<div class="pc-overflow-auto"> <!-- needed in order to avoid h1 element's margin pushing its parent element down -->
	
<h1>Find/replace using multiple regexes</h1>
	
<h2>Regex input:</h2>

</div>

<textarea id="text_code_input" class="pc-width-100"></textarea>
