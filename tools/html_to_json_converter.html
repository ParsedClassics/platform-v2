<html>

<head>

<meta http-equiv="content-type" content="text/html; charset=utf-8">

<title>HTML to JSON converter | ParsedClassics</title>

<link type="text/css" rel="stylesheet" href="./css/w3.css" />

<link type="text/css" rel="stylesheet" href="./css/pc.css" />

<script type="text/javascript" src="./js/jquery-2.1.1.js"></script>

<style>
      .page {
        position: fixed;
        top: 0;
        left: 40px;
        right: 0;
        bottom: 0;

        display: flex;
        flex-direction: column;
        font-size: 0.9em;
      }

      header {
        display: flex;
        align-items: center;
        padding: 10px 20px;
        justify-content: space-between
      }

      header .info {
        display: flex;
        align-items: center;
      }

      header h1 {
        margin: 0;
        padding-right: 10px;
        font-size: 30px;
      }

      header a {
        color: #08f;
        text-decoration: none;
        padding: 0px 10px;
      }

      header a:hover {
        text-decoration: underline;
      }

      .converter {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .split {
        display: flex;
        align-self: stretch;
        flex-direction: column;
        flex: 1;
        box-shadow: 1px 0 0 #eee;
      }

      .pane {
        display: flex;
        flex-direction: column;
        flex: 1;
        align-self: stretch;
        padding: 20px;
        font-size: 1em;
        border: none;
        margin: 0px;
        outline: none;
        overflow: auto;
      }

      .pane label {
        display: block;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 5px;
      }

      .pane-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #eee;
        padding: 10px 20px;
      }

      .pre {
        text-wrap: auto;
        height: 100%;
        overflow-y: auto;
        resize: none;
      }

      #source {
        /*flex: 1;
        display: flex;
        align-self: stretch;
        border: none;
        background-color: transparent;
        outline: none;
        padding: 0px;
        font-size: inherit; */
        text-wrap: auto;
        height: 100%;
        overflow-y: auto;
        resize: none;
      }

      #output {
        margin: 0;
        padding: 0;
      }
    </style>

</head>

<body id="tools_page">

<script type="text/javascript" src="./js/_navigation.js"></script>

<div id="pc-site-content" class="pc-width-0">
</div> <!-- End of #pc-site-content -->


<div class="page">
      <header>
        <div class="info">
          <h1>HTML to JSON converter</h1>
        </div>
        <div>
          <label>
            <input id="show-stringify-pane" type="checkbox">
            <span>Show stringify pane</span>
          </label>
        </div>
      </header>
      <div class="converter">
        <div class="split">
          <div class="pane-header">
            <label>HTML</label>
            <label>
              <input id="whitespace" type="checkbox">
              <span>Remove whitespace</span>
            </label>
          </div>
          <div class="pane pane-source">
            <textarea id="source" placeholder="&lt;div&gt;HTML to transform&lt;/div&gt;"></textarea>
          </div>
        </div>
        <div class="split">
          <div class="pane-header">
            <label>JSON (AST)</label>
            <label>
              <input id="positions" type="checkbox">
              <span>Include positions</span>
            </label>
          </div>
          <div class="pane pane-output">
            <textarea class="pre"  id="output-parse">[]</textarea>
          </div>
        </div>
        <div class="split" id="stringify-pane" style="display: none;">
          <div class="pane-header">
            <label>Stringify</label>
            <label>
              <input id="prefer-double-quote-attributes" type="checkbox">
              <span>Prefer double quote attributes</span>
            </label>
          </div>
          <div class="pane pane-output">
            <pre id="output-stringify"></pre>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/nojquery.html2json.js"></script>
    <script>
      function removeEmptyNodes (nodes) {
        return nodes.filter(node => {
          if (node.type === 'element') {
            node.children = removeEmptyNodes(node.children);
            return true
          }
          return node.content.length
        })
      }

      function stripWhitespace (nodes) {
        return nodes.map(node => {
          if (node.type === 'element') {
            node.children = stripWhitespace(node.children)
          } else {
            node.content = node.content.trim()
          }
          return node
        })
      }

      function removeWhitespace(nodes) {
        return removeEmptyNodes(stripWhitespace(nodes))
      }

      // Function commented out by ParsedClassics
      // function $ (selector) { 
      //   return document.querySelector(selector)
      // }

      function updateOutput () {
        var html = document.querySelector('#source').value || '' // $ changed to document.querySelector by ParsedClassics
        himalaya.parseDefaults.includePositions = document.querySelector('#positions').checked // $ changed to document.querySelector by ParsedClassics

        var code = himalaya.parse(html)
        if (document.querySelector('#whitespace').checked) { // $ changed to document.querySelector by ParsedClassics
          code = removeWhitespace(code)
        }

        document.querySelector('#output-parse').value =JSON.stringify(code, null, 2); // $ changed to document.querySelector by ParsedClassics

        var options = { ...himalaya.parseDefaults, preferDoubleQuoteAttributes: document.querySelector('#prefer-double-quote-attributes').checked } // $ changed to document.querySelector by ParsedClassics
        document.querySelector('#output-stringify').innerText = himalaya.stringify(code, options) // $ changed to document.querySelector by ParsedClassics
      }

      document.querySelector('#source').onkeyup = updateOutput // $ changed to document.querySelector by ParsedClassics
      document.querySelector('#whitespace').onchange = updateOutput // $ changed to document.querySelector by ParsedClassics
      document.querySelector('#positions').onchange = updateOutput // $ changed to document.querySelector by ParsedClassics
      document.querySelector('#prefer-double-quote-attributes').onchange = updateOutput // $ changed to document.querySelector by ParsedClassics
      updateOutput()

      function updatePaneDisplay () {
        document.querySelector('#stringify-pane').style.display = document.querySelector('#show-stringify-pane').checked ? 'flex' : 'none' // $ changed to document.querySelector by ParsedClassics
      }

      document.querySelector('#show-stringify-pane').onchange = updatePaneDisplay // $ changed to document.querySelector by ParsedClassics
    </script>

</body>

</html>
